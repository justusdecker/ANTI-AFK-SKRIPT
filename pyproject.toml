[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-afk-script"
version = "0.2.0"
description = "Ein gui-basiertes Anti-AFK-Tool für Windows"
readme = "README.md"
authors = [
{ name = "Justus Decker", email = "justus.d2025@gmail.com" }
]
classifiers = [
"Programming Language :: Python :: 3",
"Operating System :: Microsoft :: Windows",
"Gui Framework :: Flet :: 0.86.5"
]
requires-python = ">=3.10"
dependencies = [
"keyboard>=0.13.5",
"requests>=2.28.0",
"pywin32>=300; sys_platform == 'win32'",
"flet>=0.86.5; sys_platform == 'win32'"
]

[project.urls]
Homepage = "https://github.com/justusdecker/anti-afk-script"

[tool.setuptools.packages.find]
include = ["*"]